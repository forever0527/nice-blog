backend:
  name: git-gateway
  branch: main

media_folder: "public/img/uploads"
public_folder: "/img/uploads"

collections:
  - name: "blog"
    label: "博客文章"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "描述", name: "desc", widget: "string" }
      - { label: "日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD" }
      - { label: "标签", name: "tag", widget: "string", default: "随笔" }
      - { label: "标签颜色", name: "color", widget: "string", default: "#0040ff" }
      - { label: "封面图", name: "img", widget: "image", default: "/img/bg/1.png", required: false }
      - { label: "正文", name: "body", widget: "markdown" }